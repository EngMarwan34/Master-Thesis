<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصيانة الوقائية — المحتسب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --brand:#0F5DA3; --brand-deep:#0A3F73; --brand-soft:#E7F0F8;
  --ink:#0B2239; --muted:#5B6B7C; --surface:#F2F5F8; --card:#fff; --line:#DCE4EC;
  --ok:#0E7C66; --maint:#B7791F; --parts:#C2410C; --down:#B0233A; --na:#64748B;
  --r:14px; --shadow:0 1px 2px rgba(11,34,57,.06),0 8px 24px rgba(11,34,57,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  background:var(--surface); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:800;letter-spacing:0;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:15px;cursor:pointer}
input,select,textarea{
  font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}

/* ---------- الهيكل ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:10px 16px;display:flex;align-items:center;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top))
}
.topbar img{height:34px;background:#fff;border-radius:7px;padding:3px}
.topbar .who{margin-inline-start:auto;font-size:12.5px;opacity:.92;text-align:end;line-height:1.35}
.topbar h1{font-size:19px;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

.btn{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:600}
.btn:active{background:var(--brand-deep)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.quiet{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--down)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.c-ok{background:var(--ok)} .c-maint{background:var(--maint)} .c-parts{background:var(--parts)}
.c-down{background:var(--down)} .c-na{background:var(--na)} .c-none{background:#CBD5E1}

/* ---------- مصفوفة الفحص (العنصر المميّز) ---------- */
.mosaic{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.mosaic i{width:20px;height:20px;border-radius:5px;background:#CBD5E1;display:block}
.rail{height:7px;border-radius:99px;background:#E2E8F0;overflow:hidden;margin-top:10px}
.rail span{display:block;height:100%;background:var(--brand);transition:width .35s}

/* ---------- قوائم ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;text-align:start;width:100%}
.item .edge{width:5px;align-self:stretch;border-radius:99px;background:#CBD5E1;flex:none}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--surface);flex:none}

/* ---------- شاشة الحالة ---------- */
.sheet{position:fixed;inset:0;background:rgba(11,34,57,.45);z-index:60;display:flex;align-items:flex-end}
.sheet .panel{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 28px}
@media(min-width:700px){.sheet{align-items:center;justify-content:center}
 .sheet .panel{max-width:640px;border-radius:18px}}
.states{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.state{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:#fff;
  border-radius:12px;padding:14px;font-weight:600;width:100%;text-align:start}
.state b{width:6px;height:26px;border-radius:99px;flex:none}
.state.on{border-color:var(--brand);background:var(--brand-soft)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.addphoto{width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--brand);background:#fff;
  color:var(--brand);font-size:12px;font-weight:600}

.bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30}
.bar .inner{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .btn{flex:1}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .b{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .n{font-family:"Zain";font-size:32px;font-weight:800;line-height:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:600}
.toast{position:fixed;bottom:88px;inset-inline:16px;background:var(--ink);color:#fff;padding:12px 16px;
  border-radius:12px;z-index:90;text-align:center;font-size:14px}
.center{max-width:420px;margin:8vh auto;padding:0 18px}
.center img{width:120px;display:block;margin:0 auto 18px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
#reader{border-radius:14px;overflow:hidden}

/* ---------- التقرير ---------- */
.report{background:#fff;color:#000;max-width:820px;margin:0 auto;padding:26px}
.rhead{display:flex;gap:16px;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:12px}
.rhead img{height:76px}
.bi{font-size:12px;color:#444}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sum div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:96px}
.sum .n{font-family:"Zain";font-size:24px;font-weight:800;line-height:1.1}
.rtable th{background:#F1F5F9;color:#000;font-size:11.5px}
.rtable td{font-size:12px}
.rtable img{width:74px;height:56px;object-fit:cover;border-radius:6px}
.sign{display:flex;gap:40px;margin-top:34px}
.sign div{flex:1;border-top:1px solid #000;padding-top:7px;font-size:12px}
@media print{
  @page{size:A4;margin:12mm}
  .noprint{display:none!important}
  body{background:#fff}
  .report{padding:0;max-width:none}
  .rtable tr{break-inside:avoid}
}

function tr(s){ return (isEn() && TR[s]!==undefined) ? TR[s] : s; }

const assetLocation = a => (isEn() && a.location_text_en?.trim()) ? a.location_text_en : (a.location_text||"");

function toast(msg,ms=2600){
  const t=document.createElement("div"); t.className="toast noprint"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms);
}
function cfg(){
  const u = SUPABASE_URL || localStorage.getItem("sb_url");
  const k = SUPABASE_ANON_KEY || localStorage.getItem("sb_key");
  return (u && k) ? {u,k} : null;
}

/* ---------------------- الإقلاع ---------------------- */
(async function boot(){
  showLoading();
  const c = cfg();
  if(!c) return setupScreen();
  sb = window.supabase.createClient(c.u, c.k);
  const isRecovery = location.hash.includes("type=recovery") || location.hash.includes("type=invite");
  const {data} = await sb.auth.getSession();
  session = data.session;
  if(isRecovery && session) return resetPasswordScreen();
  if(!session) return loginScreen();
  const {data:p} = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(!p || !p.active){ await sb.auth.signOut(); return loginScreen("الحساب غير مفعّل أو لا يوجد ملف صلاحيات له. راجع مشرف النظام."); }
  me = p;
  document.documentElement.lang = isEn() ? "en" : "ar";
  document.documentElement.dir = isEn() ? "ltr" : "rtl";
  try{await loadPreferences();}catch(e){toast(e.message,6000);}
  window.addEventListener("hashchange",route);
  route();
  if(me.role!=="client") setInterval(refreshNotifBadge,30000);
})();

async function doLogin(){

  location.reload();
}
async function doForgotPassword(){
  const email = ($("#e")?.value||"").trim() || prompt("أدخل بريدك الإلكتروني المسجَّل بالنظام");
  if(!email) return;
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname});
  if(error) return toast("تعذر إرسال رابط الاستعادة: "+error.message);
  toast("أُرسل رابط استعادة كلمة المرور إلى بريدك — تفقّد الوارد أو الـSpam", 4500);
}

async function openNotifications(){

async function route(){
  if(scanner){ try{await scanner.stop()}catch(e){} scanner=null; }
  showLoading();
  const h = location.hash.replace(/^#\/?/,"");
  const [page,id] = h.split("/");
  try{
    if(page==="settings")    return await settingsPage(id);
    if(page==="schedule")    return await schedulePage();
    if(page==="client")      return await clientPage(id);
    if(page==="visit")       return await visitPage(id);
    if(page==="review")      return await reviewPage(id);
    if(page==="report")      return await reportPage(id);
    if(page==="labels")      return await labelsPage(id);
    if(page==="scan")        return await scanPage(id);
    return await homePage();
  }catch(e){
    console.error(e);
    toast(tr("تعذر تحميل البيانات: ")+e.message,6000);
    app.innerHTML = `<div class="center">
      <div class="card">
        <h2>${tr("تعذر تحميل الصفحة")}</h2>
        <p class="muted">${esc(e.message||"")}</p>
        <div style="height:14px"></div>
        <button class="btn" style="width:100%" onclick="route()">${tr("حاول مرة أخرى")}</button>
        <button class="btn quiet" style="width:100%;margin-top:8px" onclick="location.hash='#/'">${tr("الرئيسية")}</button>
      </div></div>`;
  }
}

/* ---------------------- الوصول عبر مسح ملصق QR ---------------------- */
async function scanPage(code){
  const {data:a} = await sb.from("assets").select("*").eq("qr_code",code).maybeSingle();
  if(!a){ toast(tr("هذا الرمز غير معروف أو لا يخص فرعك")); return location.hash="#/"; }
  if(me.role==="client"){ return location.hash="#/client/"+a.client_id; }

  // فني/مشرف: افتح زيارة اليوم المفتوحة لهذا العميل أو ابدأ واحدة، ثم افتح بطاقة الجهاز مباشرة
  const today = todayISO();
  let v;
  if(me.role==='technician'){
    const {data,error}=await sb.rpc('my_open_visits');if(error)throw error;
    v=data.find(v=>v.client_id===a.client_id&&v.visit_type==='preventive'&&v.visit_date===today);
  }else{
    const {data}=await sb.from('visits').select('*').eq('client_id',a.client_id).eq('technician_id',me.id)
      .in('status',['draft','rejected']).eq('visit_date',today).order('created_at',{ascending:false}).limit(1).maybeSingle();v=data;
  }
  if(!v){
    const {data:nv,error} = await sb.from("visits").insert({client_id:a.client_id,technician_id:me.id}).select().single();
    if(error){ toast(tr("تعذر بدء الزيارة: ")+error.message); return location.hash="#/"; }
    v = nv;
  }
  sessionStorage.setItem("openAssetAfterLoad", a.id);
  location.hash = "#/visit/"+v.id;
}

/* ---------------------- استيراد Excel ---------------------- */
function importExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls,.csv";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    const wb = XLSX.read(await f.arrayBuffer());
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    if(!rows.length) return toast("الملف فارغ");
    const cols = Object.keys(rows[0]);
    const pick = (...keys)=>cols.find(c=>keys.some(k=>c.includes(k)))||"";
    const map = {name:pick("اسم الجهاز","الجهاز","Equipment","Name"), no:pick("رقم الأصل","الأصل","Asset","Tag","م"),
      brand:pick("الماركة","Brand","Make"), model:pick("الموديل","Model"),
      serial:pick("التسلسلي","السيريال","Serial"), loc:pick("الموقع","Location"), cat:pick("التصنيف","النوع","Category")};
    const sel = k => `<select id="m_${k}">${["",...cols].map(c=>`<option ${c===map[k]?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
    openSheet(`<h3>استيراد ${rows.length} صفاً</h3>
      <p class="muted">طابق أعمدة ملفك بحقول النظام. اسم الجهاز ورقم الأصل مطلوبان.</p>
      <label>اسم الجهاز</label>${sel("name")}<label>رقم الأصل</label>${sel("no")}
      <div class="grid2"><div><label>الماركة</label>${sel("brand")}</div><div><label>الموديل</label>${sel("model")}</div></div>
      <div class="grid2"><div><label>الرقم التسلسلي</label>${sel("serial")}</div><div><label>الموقع</label>${sel("loc")}</div></div>
      <label>التصنيف</label>${sel("cat")}
      <div style="height:16px"></div>
      <div class="row"><button class="btn" onclick="runImport()">استيراد</button>
      <button class="btn quiet" onclick="closeSheet()">إلغاء</button></div>`);
    window._rows = rows;
  };
  inp.click();
}
async function runImport(){
  const g = k => $("#m_"+k).value;
  const [name,no] = [g("name"),g("no")];
  if(!name||!no) return toast("حدد عمودَي اسم الجهاز ورقم الأصل");
  const cid = window._client.id;
  const recs = window._rows.map(r=>({
    client_id:cid, name_ar:String(r[name]||"").trim(), asset_no:String(r[no]||"").trim(),
    brand:g("brand")?String(r[g("brand")]||""):null, model:g("model")?String(r[g("model")]||""):null,
    serial_no:g("serial")?String(r[g("serial")]||""):null, location_text:g("loc")?String(r[g("loc")]||""):null,
    category:(()=>{const v=g("cat")?String(r[g("cat")]||""):""; return CATS.find(c=>v.includes(c))||"أخرى";})()
  })).filter(r=>r.name_ar && r.asset_no);
  if(!recs.length) return toast("لا توجد صفوف صالحة");
  closeSheet(); toast("جارٍ الاستيراد…");
  const {error} = await sb.from("assets").insert(recs);
  if(error) return toast("تعذر الاستيراد: "+error.message);
  toast(`أُضيف ${recs.length} جهازاً`); route();
}

/* ---------------------- الزيارة ---------------------- */
async function startVisit(clientId, scheduleId=null){
  if(!scheduleId)return chooseVisitTeam(clientId);
  const row=window._scheduleRows?.find(r=>r.id===scheduleId);
  if(row&&!row.technician_id&&!row.scheduled_visit_technicians?.length)return chooseVisitTeam(clientId,scheduleId);
  const {data,error}=await sb.rpc('start_preventive_visit',{p_client_id:clientId,p_schedule_id:scheduleId});
  if(error)return toast(tr('تعذر بدء الزيارة: ')+error.message);
  location.hash='#/visit/'+data;
}

async function loadVisit(id){
  const {data:v} = await sb.from("visits").select("*,clients(*)").eq("id",id).single();
  if(!v)throw new Error(tr("الزيارة غير موجودة"));
  const {data:team,error:teamError}=await sb.rpc("visit_team",{p_visit_id:id});
  if(teamError)throw teamError;v.team=team||[];
  const {data:assets=[]} = await sb.from("assets").select("*").eq("client_id",v.client_id).order("asset_no");
  const {data:items=[]} = await sb.from("visit_items").select("*,photos(*)").eq("visit_id",id);
  return {v,assets,items};
}

async function visitPage(id){
  const {v,assets:allAssets,items} = await loadVisit(id);
  const isEmergency = v.visit_type==="emergency";
  const assets = isEmergency ? allAssets.filter(a=>a.id===v.target_asset_id) : allAssets.filter(a=>a.active||items.some(i=>i.asset_id===a.id));
  window._v = v; window._assets = assets; window._items = items;
  const done = new Map(items.map(i=>[i.asset_id,i]));
  const pct = assets.length ? Math.round(done.size/assets.length*100) : 0;
  const readOnly = !canEditVisit(v);

  let body = `<div class="spread" style="margin-bottom:12px">${back(me.role==="technician"?"#/":"#/client/"+v.client_id)}
    <span class="pill">${isEmergency?tr("⚡ طارئة"):done.size+tr(" من ")+assets.length}</span></div>`;

  if(isEmergency) body += `<div class="card" style="border-color:var(--parts)">
    <h3 style="color:var(--parts)">${tr("⚡ طلب صيانة طارئة")}</h3>
    ${v.general_notes?`<p>${esc(v.general_notes)}</p>`:`<p class="muted">${tr("لا يوجد وصف إضافي — افتح الجهاز أدناه وسجّل حالته.")}</p>`}</div>`;

  if(v.status==="rejected") body += `<div class="card" style="border-color:var(--down)">
    <h3 style="color:var(--down)">${tr("أُعيدت الزيارة للتعديل")}</h3><p>${esc(v.reject_reason||"")}</p></div>`;

  const canAddHelper = !readOnly && !isEmergency && (me.role==="supervisor" || v.team.some(t=>t.technician_id===me.id));
  const canEditCrm = me.role==="supervisor"; // الفني لا يتعامل مع تذكرة CRM ولا عرض السعر — هذا للمشرف فقط
  body += `<div class="card"><h3>${esc(v.clients.name_ar)}</h3>
    <p class="muted">${tr("زيارة ")}${fmt(v.visit_date)} · ${tr("بدأت ")}${time(v.check_in)}</p>
    <div class="row">${(v.team||[]).map(t=>`<span class="pill">${esc(t.full_name)}</span>`).join("")}
      ${canAddHelper?`<button class="btn quiet sm" onclick="addVisitHelper('${v.id}')">${tr("+ إضافة فني للمساعدة")}</button>`:""}</div>
    <div class="mosaic">${assets.map(a=>{const it=done.get(a.id);
      return `<i style="background:${it?`var(${stateOf(it.condition).v})`:"#CBD5E1"}"></i>`}).join("")}</div>
    <div class="rail"><span style="width:${pct}%"></span></div>
    ${me.role!=="client"?`<div class="row" style="margin-top:10px;flex-wrap:wrap">
      <span class="pill">${tr("تذكرة CRM: ")}${esc(v.crm_ticket_no||"—")}</span>
      ${v.quote_url?`<a class="pill" href="${v.quote_url}" target="_blank" rel="noopener">${tr("عرض السعر ↗")}</a>`:""}
      ${canEditCrm?`<button class="btn quiet sm" onclick="editCrmInfo()">تعديل بيانات CRM</button>`:""}
    </div>`:""}</div>`;

  if(!readOnly) body += `<div class="card"><div class="spread"><h3>${tr("مسح ملصق الجهاز")}</h3>
    <button class="btn ghost sm" onclick="toggleScan()">${tr("فتح الكاميرا")}</button></div>
    <div id="reader" style="margin-top:10px"></div></div>`;

  body += `<div class="card"><h3>${tr("الأجهزة")}</h3><div class="list" style="margin-top:10px">
    ${assets.map(a=>{ const it=done.get(a.id); const s=it?stateOf(it.condition):null;
      return `<button class="item" onclick="openAsset('${a.id}')">
        <span class="edge" style="background:${s?`var(${s.v})`:"#CBD5E1"}"></span>
        ${a.base_photo_url?`<img class="thumb" src="${a.base_photo_url}" style="cursor:pointer" onclick="event.stopPropagation();openPhotoViewer('${a.base_photo_url}')">`:""}
        <span class="body"><span class="t">${esc(assetName(a))}</span>
        <span class="s">${esc(a.asset_no)} ${assetLocation(a)?"· "+esc(assetLocation(a)):""}</span></span>
        <span class="muted" style="font-size:12.5px">${it?tr(esc(it.condition)):tr("لم يُفحص")}</span></button>`;
    }).join("")}</div></div>`;

  const bar = readOnly ? "" :
    (isEmergency ? `<button class="btn" onclick="finishVisit()">${tr("إنهاء الطلب")}</button>`
      : `<button class="btn quiet" onclick="addAssetInVisit()">${tr("جهاز غير مسجّل")}</button>
     <button class="btn" onclick="finishVisit()">${tr("إنهاء الزيارة")}</button>`);
  shell(isEmergency?tr("صيانة طارئة"):tr("زيارة صيانة وقائية"), body, bar);
  window._client = v.clients;

  const pendingAsset = sessionStorage.getItem("openAssetAfterLoad");
  if(pendingAsset){
    sessionStorage.removeItem("openAssetAfterLoad");
    if(assets.some(x=>x.id===pendingAsset)) openAsset(pendingAsset);
  }
}

async function toggleScan(){
  if(scanner){ await scanner.stop(); scanner=null; return; }
  scanner = new Html5Qrcode("reader");
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}}, txt=>{
      const raw = txt.trim();
      const oldFormatCode = raw.includes("/scan/") ? raw.split("/scan/")[1] : null;
      const a = window._assets.find(x=>x.asset_no===raw || x.qr_code===raw || (oldFormatCode && x.qr_code===oldFormatCode));
      scanner.stop().then(()=>{scanner=null;});
      if(a) openAsset(a.id); else toast(tr("هذا الملصق لا يخص أجهزة هذا العميل"));
    }, ()=>{});
  }catch(e){ scanner=null; toast(tr("تعذر فتح الكاميرا. اختر الجهاز من القائمة.")); }
}

async function addAssetInVisit(){ window._client = window._v.clients; await addAsset(); location.hash="#/visit/"+window._v.id; route(); }

/* ---------------------- إضافة فني للمساعدة بزيارة جارية ---------------------- */
async function addVisitHelper(visitId){
  const v = window._v;
  const currentTeamIds = new Set((v.team||[]).map(t=>t.technician_id));
  const {data:techs=[], error} = await sb.from("profiles").select("id,full_name")
    .eq("role","technician").eq("branch",me.branch).eq("active",true).order("full_name");

  openSheet(`<h2>${tr("إضافة فني للمساعدة")}</h2>
    <p class="muted">${tr("ينضم الفني لفريق هذه الزيارة فوراً ويقدر يفتحها من \"مهامي المفتوحة\".")}</p>
    <form onsubmit="saveVisitHelper(event,'${visitId}')">
      <label for="helperTech">${tr("الفني")}</label>
      <select id="helperTech">${available.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}</select>

      <button class="btn" type="submit">${tr("إضافة")}</button></div>

}
async function saveVisitHelper(event, visitId){
  event.preventDefault();
  const technician_id = $("#helperTech").value;
  const button = event.target.querySelector("[type=submit]"); button.disabled = true;
  const {error} = await sb.rpc("add_visit_technician", {p_visit_id:visitId, p_technician_id:technician_id});
  if(error){ toast(tr("تعذر الإضافة: ")+error.message); button.disabled = false; return; }
  closeSheet(); toast(tr("انضمّ الفني لفريق الزيارة")); route();
}

function editCrmInfo(){

    <button class="btn" style="width:100%" onclick="saveCrmInfo()">حفظ</button>
  `);

}
function pickQuoteFile(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*,application/pdf";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    toast("جارٍ رفع الملف…");
    try{
      const ext = (f.name.split(".").pop()||"pdf").toLowerCase();
      const path = `quotes/${window._v.id}-${Date.now()}.${ext}`;
      const {error} = await sb.storage.from("visit-photos").upload(path,f,{contentType:f.type||"application/octet-stream"});
      if(error) throw error;
      const {data} = sb.storage.from("visit-photos").getPublicUrl(path);
      window._crmDraft.quote_url = data.publicUrl;
      const row = $("#crmQuoteRow");
      if(row) row.innerHTML = `<a href="${data.publicUrl}" target="_blank" rel="noopener" class="pill">الملف الجديد ↗</a>
        <button class="btn quiet sm" onclick="pickQuoteFile()">استبدال الملف</button>`;
      toast("تم رفع الملف — اضغط حفظ لإتمام الحفظ");
    }catch(e){ toast("تعذر رفع الملف: "+(e.message||"")); }
  };
  inp.click();
}
async function saveCrmInfo(){
  const crm_ticket_no = $("#crmNo").value.trim()||null;
  const {quote_url} = window._crmDraft;
  const {error} = await sb.from("visits").update({crm_ticket_no,quote_url}).eq("id",window._v.id);
  if(error) return toast("تعذر الحفظ: "+error.message);
  closeSheet(); toast("تم حفظ بيانات CRM"); route();
}

/* ---------------------- بطاقة فحص الجهاز ---------------------- */
function openSheet(html){

  d.addEventListener("click",e=>{ if(e.target===d) closeSheet(); });

}
function closeSheet(){ $("#sheetEl")?.remove(); }

async function openAsset(assetId){
  const a = window._assets.find(x=>x.id===assetId);
  const item = window._items.find(i=>i.asset_id===assetId);
  const readOnly = !canEditVisit(window._v);

  // سجل الجهاز السابق
  const {data:hist=[]} = await sb.from("visit_items")
    .select("condition,technician_notes,parts_needed_text,photos(url,type),visits!inner(visit_date,status,id,technician_id)")
    .eq("asset_id",assetId).neq("visit_id",window._v.id)
    .order("visits(visit_date)",{ascending:false}).limit(10);
  const histTechIds = [...new Set(hist.map(h=>h.visits.technician_id).filter(Boolean))];
  const histTechMap = new Map();
  if(histTechIds.length){
    const {data:histTechs=[]} = await sb.from("profiles").select("id,full_name").in("id",histTechIds);
    histTechs.forEach(t=>histTechMap.set(t.id,t.full_name));
  }
  const repeated = item ? false : hist.some(h=>h.condition!=="سليم" && h.condition!=="غير متاح للفحص");

  window._draft = { assetId, condition:item?.condition||null, itemId:item?.id||null,
    notes:item?.technician_notes||"", parts:item?.parts_needed_text||"",
    photos:(item?.photos||[]).map(p=>({url:p.url,type:p.type})) };

  openSheet(`
    <div class="spread"><h3>${esc(assetName(a))}</h3><button class="btn quiet sm" onclick="closeSheet()">${tr("إغلاق")}</button></div>
    <div style="text-align:center;margin:6px 0 10px">
      ${a.base_photo_url?`<img src="${a.base_photo_url}" alt="${tr("الصورة المرجعية")}" style="max-width:200px;max-height:200px;border-radius:10px;border:1px solid var(--line);object-fit:cover;cursor:pointer" onclick="openPhotoViewer('${a.base_photo_url}')">`
        :`<p class="muted" style="margin:0 0 6px">${tr("لا توجد صورة مرجعية لهذا الجهاز بعد — أضِفها للتأكد من هوية الجهاز عند كل زيارة.")}</p>`}
      <div style="margin-top:6px">
        <button class="btn quiet sm" onclick="uploadAssetPhoto('${a.id}')">${a.base_photo_url?tr("تغيير الصورة المرجعية"):tr("إضافة صورة مرجعية")}</button>
      </div>
    </div>
    <p class="muted">${esc(a.asset_no)} · ${esc(categoryLabel(a.category))} ${a.brand?"· "+esc(a.brand):""} ${a.model?"· "+esc(a.model):""}
      ${a.serial_no?"<br>"+tr("الرقم التسلسلي: ")+esc(a.serial_no):""} ${assetLocation(a)?"<br>"+tr("الموقع: ")+esc(assetLocation(a)):""}</p>
    ${repeated?`<div class="card" style="background:#FEF6E7;border-color:var(--maint);padding:11px">
      <b style="color:var(--maint)">${tr("تنبيه:")}</b> ${tr("سُجّلت ملاحظات على هذا الجهاز في زيارة سابقة.")}</div>`:""}
    ${hist.length?`<details open style="margin:10px 0"><summary style="cursor:pointer;font-weight:600">${tr("سجل الصيانات السابقة")} (${hist.length})</summary>
      ${hist.map(h=>`<div style="border-top:1px solid var(--line);padding:9px 0">
        <div class="row"><span class="dot ${stateOf(h.condition)?.c}"></span><b>${tr(esc(h.condition))}</b>
          <span class="muted">${fmt(h.visits.visit_date)}</span></div>
        ${h.parts_needed_text?`<div class="muted">${tr("القطع:")} ${esc(h.parts_needed_text)}</div>`:""}
        ${h.technician_notes?`<div class="muted">${esc(h.technician_notes)}</div>`:""}
        <div class="photos">${(h.photos||[]).map(p=>`<img src="${p.url}" onclick="openPhotoViewer('${p.url}',{technicianNames:'${esc(histTechMap.get(h.visits.technician_id)||"")}'})">`).join("")}</div>
      </div>`).join("")}</details>`:`<p class="muted">${tr("لا يوجد سجل صيانة سابق لهذا الجهاز.")}</p>`}

    <label>${tr("حالة الجهاز")}</label>
    <div class="states" id="states">${STATES.map(s=>`
      <button class="state ${window._draft.condition===s.k?"on":""}" data-k="${s.k}" onclick="pickState('${s.k}')"
        ${readOnly?"disabled":""}><b style="background:var(${s.v})"></b>${tr(s.k)}</button>`).join("")}</div>

    ${readOnly?"":`<div style="height:16px"></div>
      <button id="saveItemButton" class="btn" style="width:100%" onclick="saveItem()">${tr("حفظ الجهاز")}</button>
      <button class="btn quiet" style="width:100%;margin-top:8px;color:var(--down)" onclick="closeSheet();deleteAssetWithReason('${a.id}')">${tr("حذف هذا الجهاز من القائمة")}</button>`}
  `);
  renderExtra();

/* ---------------------- الصورة المرجعية للجهاز ---------------------- */
function uploadAssetPhoto(assetId){
  captureOrPickPhoto().then(async f=>{
    toast(tr("جارٍ رفع الصورة…"));
    try{
      const blob = await compress(f);
      const path = `assets/${assetId}-${Date.now()}.jpg`;
      const {error:upErr} = await sb.storage.from("visit-photos").upload(path,blob,{contentType:"image/jpeg"});
      if(upErr) throw upErr;
      const {data:pub} = sb.storage.from("visit-photos").getPublicUrl(path);
      const {error} = await sb.rpc("set_asset_base_photo",{p_asset_id:assetId,p_photo_url:pub.publicUrl});
      if(error) throw error;
      toast(tr("تم حفظ الصورة المرجعية"));
      (window._assets||[]).forEach(a=>{ if(a.id===assetId) a.base_photo_url = pub.publicUrl; });
      if(window._draft && window._draft.assetId===assetId){ closeSheet(); openAsset(assetId); }
      else route();
    }catch(e){ toast(tr("تعذر رفع الصورة: ")+(e.message||"")); }
  }).catch(()=>{});
}

function pickState(k){
  if(!canEditVisit(window._v)) return;
  window._draft.condition = k;
  document.querySelectorAll("#states .state").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  renderExtra();
}

function renderExtra(){
  const d = window._draft; const box = $("#extra"); if(!box) return;
  const editable=canEditVisit(window._v);
  const needDefect = d.condition && !["سليم","غير متاح للفحص"].includes(d.condition);
  box.innerHTML = `
    <label>${tr("صورة الجهاز (إلزامية)")}</label>
    <div class="photos">${d.photos.filter(p=>p.type==="general").map((p,i)=>
      `<img src="${p.url}" onclick="openDraftPhoto('general',${i})">`).join("")}
      ${editable?`<button class="addphoto" onclick="pickPhoto('general')">${tr("+ صورة")}</button>`:""}</div>
    ${needDefect?`<label>${tr("صور العيب (إلزامية)")}</label>
      <div class="photos">${d.photos.filter(p=>p.type==="defect").map((p,i)=>
        `<img src="${p.url}" onclick="openDraftPhoto('defect',${i})">`).join("")}
        ${editable?`<button class="addphoto" onclick="pickPhoto('defect')">${tr("+ صورة")}</button>`:""}</div>
      <label>${tr("القطع المطلوبة")}</label>
      <textarea id="parts" ${editable?"":"readonly"} placeholder="${tr("اكتب القطع المطلوبة ووصف العطل")}">${esc(d.parts)}</textarea>`:""}
    <label>${tr("ملاحظات الفني")}</label>
    <textarea id="notes" ${editable?"":"readonly"} placeholder="${d.condition==='غير متاح للفحص'?tr('اكتب سبب تعذر الفحص'):tr('اختياري')}">${esc(d.notes)}</textarea>`;
}

function pickPhoto(type){
  if(!canEditVisit(window._v)) return;
  keepText();
  captureOrPickPhoto().then(async f=>{

/* ---------------------- عارض الصورة (فتح/تنزيل/تغيير) ---------------------- */
async function downloadImage(url,filename){
  try{
    const resp = await fetch(url);
    const blob = await resp.blob();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=filename||url.split("/").pop().split("?")[0]||"photo.jpg";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }catch(e){ toast(tr("تعذر تنزيل الصورة: ")+(e.message||"")); }
}
function openPhotoViewer(url,opts={}){
  const {technicianNames="",canDelete=false,canReplace=false,onDelete=null,onReplace=null} = opts;
  const d=document.createElement("div");
  d.className="sheet noprint"; d.style.zIndex=95;
  d.innerHTML=`<div class="panel" style="padding:0;max-width:none;max-height:none;width:100%;height:100%;border-radius:0;display:flex;flex-direction:column;background:#000">
    <div style="flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:0">
      <img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain">
    </div>
    ${technicianNames?`<div style="color:#fff;text-align:center;padding:6px 16px;font-size:13px">${tr("الفني: ")}${esc(technicianNames)}</div>`:""}
    <div style="display:flex;gap:10px;padding:16px;background:#000;flex-wrap:wrap">
      <button class="btn quiet" style="flex:1" id="pvClose">${tr("إغلاق")}</button>
      <button class="btn quiet" style="flex:1" id="pvDownload">${tr("تنزيل")}</button>
      ${canReplace?`<button class="btn quiet" style="flex:1" id="pvReplace">${tr("تغيير")}</button>`:""}
      ${canDelete?`<button class="btn" style="flex:1;background:var(--down);border-color:var(--down)" id="pvDelete">${tr("حذف")}</button>`:""}
    </div></div>`;

  d.addEventListener("click",e=>{ if(e.target===d) d.remove(); });
  d.querySelector("#pvClose").onclick=()=>d.remove();
  d.querySelector("#pvDownload").onclick=()=>downloadImage(url);
  if(canReplace) d.querySelector("#pvReplace").onclick=()=>{ d.remove(); onReplace?.(); };

function keepText(){
  const d=window._draft;
  if($("#notes")) d.notes=$("#notes").value;
  if($("#parts")) d.parts=$("#parts").value;
}
/* ---------------------- التقاط صورة داخل الصفحة (بدون فتح تطبيق كاميرا منفصل) ---------------------- */
function captureFromCamera(){
  return new Promise((resolve,reject)=>{
    if(!navigator.mediaDevices?.getUserMedia){ reject(new Error("no-camera-api")); return; }
    const overlay=document.createElement("div");
    overlay.className="sheet noprint";
    overlay.style.zIndex=100;
    overlay.innerHTML=`<div class="panel" style="padding:0;max-width:none;max-height:none;width:100%;height:100%;border-radius:0;display:flex;flex-direction:column;background:#000">
      <video id="camVideo" autoplay playsinline muted style="flex:1;width:100%;min-height:0;object-fit:cover;background:#000"></video>
      <div style="display:flex;gap:10px;padding:16px;background:#000;flex-wrap:wrap">
        <button id="camCancel" class="btn quiet" style="flex:1">${tr("إلغاء")}</button>
        <button id="camGallery" class="btn quiet" style="flex:1">${tr("اختر من المعرض")}</button>
        <button id="camShoot" class="btn" style="flex:2">${tr("التقط الصورة")}</button>
      </div></div>`;
    document.body.appendChild(overlay);
    let stream=null, settled=false;
    const cleanup=()=>{ stream?.getTracks().forEach(t=>t.stop()); overlay.remove(); };
    const finish=(fn,arg)=>{ if(settled)return; settled=true; cleanup(); fn(arg); };
    overlay.querySelector("#camCancel").onclick=()=>finish(reject,new Error("cancelled"));
    overlay.querySelector("#camGallery").onclick=()=>finish(()=>{ pickPhotoFile().then(resolve,reject); });
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(s=>{
      if(settled){ s.getTracks().forEach(t=>t.stop()); return; }
      stream=s; overlay.querySelector("#camVideo").srcObject=s;
    }).catch(e=>finish(reject,e));
    overlay.querySelector("#camShoot").onclick=()=>{
      const video=overlay.querySelector("#camVideo");
      if(!video.videoWidth) return;
      const cv=document.createElement("canvas");
      cv.width=video.videoWidth; cv.height=video.videoHeight;
      cv.getContext("2d").drawImage(video,0,0);
      cv.toBlob(b=>finish(b?resolve:reject, b||new Error("capture-failed")),"image/jpeg",0.85);
    };
  });
}
function pickPhotoFile(){
  return new Promise((resolve,reject)=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
    inp.onchange=()=>{ const f=inp.files[0]; f?resolve(f):reject(new Error("no-file")); };
    inp.click();
  });
}
function captureOrPickPhoto(){
  return captureFromCamera().catch(e=>{
    if(e.message==="cancelled") throw e;
    return pickPhotoFile();
  });
}

function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(new Error("فشل الضغط")),"image/jpeg",0.7);
    };
    img.onerror=()=>rej(new Error("ملف صورة غير صالح"));
    img.src=url;
  });
}

function canEditVisit(v){
  return !!v && ['draft','rejected'].includes(v.status) &&
    (me.role==='supervisor' || (me.role==='technician' && (v.technician_id===me.id||(v.team||[]).some(t=>t.technician_id===me.id))));
}
async function saveItem(){
  if(!canEditVisit(window._v) || window._savingItem) return;
  keepText();
  const d = window._draft;
  if(!d.condition) return toast(tr("اختر حالة الجهاز"));
  if(!d.photos.some(p=>p.type==="general")) return toast(tr("أضف صورة الجهاز"));
  if(d.condition==='غير متاح للفحص' && !d.notes.trim()) return toast(tr('اكتب سبب تعذر الفحص'));
  if(!['سليم','غير متاح للفحص'].includes(d.condition)){
    if(!d.photos.some(p=>p.type==='defect')) return toast(tr('أضف صورة للعيب'));
    if(!d.parts.trim()) return toast(tr('اكتب القطع المطلوبة أو وصف العطل'));
  }
  window._savingItem=true;
  const btn=$('#saveItemButton'); if(btn){btn.disabled=true;btn.textContent=tr('جارٍ الحفظ…');}
  try{
    const {error} = await sb.rpc('save_visit_item', {p_visit_id:window._v.id,p_asset_id:d.assetId,
      p_condition:d.condition,p_notes:d.notes,p_parts:d.parts,
      p_photos:d.photos.map(p=>({url:p.url,type:p.type}))});
    if(error) throw error;
    closeSheet();toast(tr('حُفظ الفحص والصور بنجاح'));await route();
  }catch(e){toast(tr('تعذر الحفظ. بياناتك ما زالت هنا: ')+e.message,5000);}
  finally{window._savingItem=false;if(btn){btn.disabled=false;btn.textContent=tr('حفظ الجهاز');}}
}

async function finishVisit(){
  if(!canEditVisit(window._v)) return toast(tr("هذه الزيارة غير قابلة للتعديل"));
  const v = window._v;
  const total = window._assets.length, done = window._items.length;
  if(done===0) return toast(tr("لم تُفحص أي أجهزة بعد"));
  if(done<total && !confirm(`${tr("فُحص ")}${done}${tr(" من ")}${total}${tr(". إنهاء الزيارة الآن؟")}`)) return;
  const rec = prompt(tr("التوصيات العامة (تظهر في التقرير)"))||"";
  const {error} = await sb.from("visits").update({status:"submitted",check_out:new Date().toISOString(),
    recommendations:rec, reject_reason:null}).eq("id",v.id);
  if(error) return toast(tr("تعذر الإرسال: ")+error.message);
  toast(tr("أُرسلت الزيارة للاعتماد"));
  location.hash = me.role==="technician" ? "#/" : "#/client/"+v.client_id;
}

/* ---------------------- تصحيح إملائي بالذكاء الاصطناعي ---------------------- */
async function aiFixReport(visitId){
  const btn = $("#aiFixBtn");
  const fields = [];
  const recTa = $("#rec");
  if(recTa && recTa.value.trim()) fields.push({id:"rec", text:recTa.value});
  for(const i of (window._items||[])){
    const noteTa = $("#note_"+i.id);
    if(noteTa && noteTa.value.trim()) fields.push({id:"note_"+i.id, text:noteTa.value});
    const partsTa = $("#parts_"+i.id);
    if(partsTa && partsTa.value.trim()) fields.push({id:"parts_"+i.id, text:partsTa.value});
  }
  if(!fields.length) return toast("لا يوجد نص لتصحيحه");
  btn.disabled = true; const oldLabel = btn.textContent; btn.textContent = "جارٍ التصحيح…";
  try{
    const {data,error} = await sb.functions.invoke("fix-arabic-text",{body:{items:fields}});
    if(error) throw error;
    const byId = new Map((data?.items||[]).map(x=>[x.id,x.corrected]));
    let changed = 0;
    for(const f of fields){
      const corrected = byId.get(f.id);
      if(corrected==null) continue;
      const el = $("#"+f.id);
      if(el && corrected !== el.value){ el.value = corrected; changed++; }
    }
    toast(changed ? `تم تصحيح ${changed} حقلاً — راجعها قبل الاعتماد` : "لم يحتَج النص أي تصحيح");
  }catch(e){
    toast("تعذر التصحيح التلقائي: "+(e.message||"تحقق من نشر دالة fix-arabic-text"));
  }finally{
    btn.disabled = false; btn.textContent = oldLabel;
  }
}

async function approveVisit(id){
  if(window._approving) return;
  window._approving=true;
  try{
    const items=(window._items||[]).map(i=>({id:i.id,
      notes:$('#note_'+i.id)?.value??i.technician_notes??'',
      parts:$('#parts_'+i.id)?.value??i.parts_needed_text??''}));
    const {error}=await sb.rpc('approve_visit',{p_visit_id:id,p_recommendations:$('#rec')?.value||'',p_items:items});
    if(error) throw error;
    location.hash='#/report/'+id;
  }catch(e){toast('تعذر الاعتماد: '+e.message,5000);}
  finally{window._approving=false;}
}
async function rejectVisit(id){
  const why = prompt("سبب الإعادة للفني"); if(!why) return;
  const {error} = await sb.from("visits").update({status:"rejected",reject_reason:why}).eq("id",id);
  if(error) return toast("تعذر الحفظ: "+error.message);
  toast("أُعيدت الزيارة للفني"); location.hash="#/";
}

  }));

  XLSX.writeFile(wb,`قطع_${window._reportVisit.report_no||"زيارة"}.xlsx`);

}
