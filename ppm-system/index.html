<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصيانة الوقائية — المحتسب | Al-Mohtaseb PPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Zain:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --brand:#0F5DA3; --brand-deep:#0A3F73; --brand-soft:#E7F0F8;
  --ink:#0B2239; --muted:#5B6B7C; --surface:#F2F5F8; --card:#fff; --line:#DCE4EC;
  --ok:#0E7C66; --maint:#B7791F; --parts:#C2410C; --down:#B0233A; --na:#64748B;
  --r:14px; --shadow:0 1px 2px rgba(11,34,57,.06),0 8px 24px rgba(11,34,57,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  background:var(--surface); color:var(--ink); font-size:15px; line-height:1.65;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:800;letter-spacing:0;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:15px;cursor:pointer}
input,select,textarea{
  font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}

/* ---------- الهيكل ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:10px 16px;display:flex;align-items:center;gap:12px;
  padding-top:calc(10px + env(safe-area-inset-top))
}
.topbar img{height:34px;background:#fff;border-radius:7px;padding:3px}
.topbar .who{margin-inline-start:auto;font-size:12.5px;opacity:.92;text-align:end;line-height:1.35}
.topbar h1{font-size:19px;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

.btn{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:600}
.btn:active{background:var(--brand-deep)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.quiet{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--down)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.5}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.c-ok{background:var(--ok)} .c-maint{background:var(--maint)} .c-parts{background:var(--parts)}
.c-down{background:var(--down)} .c-na{background:var(--na)} .c-none{background:#CBD5E1}

/* ---------- مصفوفة الفحص (العنصر المميّز) ---------- */
.mosaic{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 4px}
.mosaic i{width:20px;height:20px;border-radius:5px;background:#CBD5E1;display:block}
.rail{height:7px;border-radius:99px;background:#E2E8F0;overflow:hidden;margin-top:10px}
.rail span{display:block;height:100%;background:var(--brand);transition:width .35s}

/* ---------- قوائم ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;text-align:start;width:100%}
.item .edge{width:5px;align-self:stretch;border-radius:99px;background:#CBD5E1;flex:none}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;display:block}
.item .s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .muted{font-size:12.5px}
html,body{overflow-x:hidden}
.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--surface);flex:none}

/* ---------- شاشة الحالة ---------- */
.sheet{position:fixed;inset:0;background:rgba(11,34,57,.45);z-index:60;display:flex;align-items:flex-end}
.sheet .panel{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 28px}
@media(min-width:700px){.sheet{align-items:center;justify-content:center}
 .sheet .panel{max-width:640px;border-radius:18px}}
.states{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.state{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:#fff;
  border-radius:12px;padding:14px;font-weight:600;width:100%;text-align:start}
.state b{width:6px;height:26px;border-radius:99px;flex:none}
.state.on{border-color:var(--brand);background:var(--brand-soft)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.addphoto{width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--brand);background:#fff;
  color:var(--brand);font-size:12px;font-weight:600}

.bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30}
.bar .inner{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .btn{flex:1}

.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .b{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .n{font-family:"Zain";font-size:32px;font-weight:800;line-height:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:600}
.toast{position:fixed;bottom:88px;inset-inline:16px;background:var(--ink);color:#fff;padding:12px 16px;
  border-radius:12px;z-index:90;text-align:center;font-size:14px}
.center{max-width:420px;margin:8vh auto;padding:0 18px}
.center img{width:120px;display:block;margin:0 auto 18px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
#reader{border-radius:14px;overflow:hidden}
/* ثنائي اللغة: الإنجليزي سطر صغير تحت العربي / Bilingual: English line under Arabic */
.en{display:block;font-size:.78em;font-weight:500;opacity:.78;direction:ltr;unicode-bidi:isolate;line-height:1.3}
.pill .en,.btn.sm .en,.item .s .en,.who .en{display:inline;margin-inline-start:6px}
.btn .en{opacity:.85}

/* ---------- التقرير ---------- */
.report{background:#fff;color:#000;max-width:820px;margin:0 auto;padding:26px}
.rhead{display:flex;gap:16px;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:12px}
.rhead img{height:76px}
.bi{font-size:12px;color:#444}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sum > div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:96px}
.sum .n{font-family:"Zain";font-size:24px;font-weight:800;line-height:1.1}
.rtable th{background:#F1F5F9;color:#000;font-size:11.5px}
.rtable td{font-size:12px}
.rtable img{width:74px;height:56px;object-fit:cover;border-radius:6px}
.sign{display:flex;gap:40px;margin-top:34px}
.sign > div{flex:1;border-top:1px solid #000;padding-top:7px;font-size:12px}
@media print{
  @page{size:A4;margin:12mm}
  .noprint{display:none!important}
  body{background:#fff}
  .report{padding:0;max-width:none}
  .rtable tr{break-inside:avoid}
}
</style>
</head>

const STATES = [
  {k:"سليم",              en:"Good",              c:"c-ok",    v:"--ok"},
  {k:"يحتاج صيانة",        en:"Needs maintenance", c:"c-maint", v:"--maint"},
  {k:"يحتاج قطع غيار",     en:"Needs spare parts", c:"c-parts", v:"--parts"},

  {k:"غير متاح للفحص",     en:"Not accessible",    c:"c-na",    v:"--na"}

const stateOf = k => STATES.find(s=>s.k===k);
const CATS = ["تبريد","طبخ","تكييف","غسيل","أخرى"];
const CAT_EN = {"تبريد":"Refrigeration","طبخ":"Cooking","تكييف":"HVAC","غسيل":"Laundry","أخرى":"Other"};
/* ثنائي اللغة بلا تبديل: كل نص يظهر بالعربي ثم الإنجليزي

const T = (ar,en) => `${ar}<span class="en">${en}</span>`;
const L = (ar,en) => `${ar} / \u2066${en}\u2069`;   // \u2066…\u2069 يعزل اتجاه الإنجليزي فلا تختلط الكلمات
const condEn = k => stateOf(k)?.en || "";
// يقبل التصنيف بالعربي أو الإنجليزي (Refrigeration أو تبريد)
const parseCat = v => { v=(v||"").trim().toLowerCase(); return CATS.find(k=>k===v||CAT_EN[k].toLowerCase()===v) || null; };
const catPrompt = () => L("التصنيف","Category")+":\n"+CATS.map(k=>k+" ("+CAT_EN[k]+")").join(" / ");
const assetName = a => esc(a?.name_ar||"") + (a?.name_en && a.name_en!==a.name_ar ? `<span class="en">${esc(a.name_en)}</span>` : "");
const VTYPE = {preventive:{ar:"وقائية",en:"Preventive"}, emergency:{ar:"طارئة",en:"Emergency"}};

let sb=null, me=null, session=null, scanner=null;
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// أرقام لاتينية ومعزولة الاتجاه حتى تُقرأ صحيحة بجانب النص العربي والإنجليزي
const fmt = d => d ? "\u2066"+new Date(d).toLocaleDateString("en-GB",{year:"numeric",month:"2-digit",day:"2-digit"})+"\u2069" : "—";
const time = d => d ? "\u2066"+new Date(d).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})+"\u2069" : "—";

/* بحث فوري داخل قوائم الأجهزة: يطابق الاسم بالعربي/الإنجليزي ورقم الأصل والموقع */
const searchKey = a => [a.name_ar,a.name_en,a.asset_no,a.location_text,a.brand].filter(Boolean).join(" ").toLowerCase();
function filterList(listId){
  const q = ($("#q_"+listId)?.value||"").trim().toLowerCase();
  const onlyTodo = $("#todo_"+listId)?.classList.contains("on");
  let shown = 0;
  document.querySelectorAll(`#${listId} > [data-q]`).forEach(el=>{
    const ok = (!q || el.dataset.q.includes(q)) && (!onlyTodo || el.dataset.done!=="1");
    el.style.display = ok ? "" : "none"; if(ok) shown++;
  });
  const c = $("#cnt_"+listId); if(c) c.textContent = shown;
}
const searchBox = (listId, todo=false) => `<div class="row" style="margin-top:10px;flex-wrap:nowrap">
  <input id="q_${listId}" type="search" placeholder="${L("بحث بالاسم أو رقم الأصل أو الموقع","Search name, asset no., location")}" oninput="filterList('${listId}')">
  ${todo?`<button class="btn quiet sm" id="todo_${listId}" style="white-space:nowrap" onclick="this.classList.toggle('on');this.style.background=this.classList.contains('on')?'var(--brand-soft)':'';filterList('${listId}')">${T("غير المفحوص","Unchecked")}</button>`:""}
  <span class="pill" id="cnt_${listId}"></span></div>`;

function toast(msg,ms=2600){
  const t=document.createElement("div"); t.className="toast noprint"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms);
}
function cfg(){
  const u = SUPABASE_URL || localStorage.getItem("sb_url");
  const k = SUPABASE_ANON_KEY || localStorage.getItem("sb_key");
  return (u && k) ? {u,k} : null;
}

/* ---------------------- الإقلاع ---------------------- */
(async function boot(){
  const qp = new URLSearchParams(location.search).get("q");
  if(qp) history.replaceState(null,"",location.pathname+"#/scan/"+encodeURIComponent(qp));
  const c = cfg();
  if(!c) return setupScreen();
  sb = window.supabase.createClient(c.u, c.k);
  const isRecovery = location.hash.includes("type=recovery");
  const {data} = await sb.auth.getSession();
  session = data.session;
  if(isRecovery && session) return resetPasswordScreen();
  const scanCode = (location.hash.match(/^#\/scan\/([^/?#]+)/)||[])[1];
  if(!session) return scanCode ? publicRequestPage(decodeURIComponent(scanCode)) : loginScreen();
  const {data:p} = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(!p){ await sb.auth.signOut(); return loginScreen(L("لا يوجد ملف صلاحيات لهذا الحساب. راجع مشرف النظام.","This account has no profile. Contact your supervisor.")); }
  me = p;
  window.addEventListener("hashchange",route);
  route();
})();

function saveCfg(){

}

async function doLogin(){
  const email=$("#e").value.trim(), password=$("#p").value;
  const {error} = await sb.auth.signInWithPassword({email,password});
  if(error) return toast(L("تعذر الدخول: تحقق من البريد وكلمة المرور","Sign-in failed: check email and password"));
  location.reload();
}
async function doForgotPassword(){
  const email = ($("#e")?.value||"").trim() || prompt(L("أدخل بريدك الإلكتروني المسجَّل بالنظام","Enter your registered email"));
  if(!email) return;
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname});
  if(error) return toast(L("تعذر إرسال رابط الاستعادة","Could not send reset link")+": "+error.message);
  toast(L("أُرسل رابط الاستعادة إلى بريدك — تفقّد الوارد أو الـSpam","Reset link sent — check inbox or spam"), 4500);
}
async function logout(){ await sb.auth.signOut(); location.hash=""; location.reload(); }

function resetPasswordScreen(){
  app.innerHTML = `<div class="center">
    <img src="${LOGO}" alt="المحتسب">
    <div class="card">
      <h2>${T("تعيين كلمة مرور جديدة","Set a new password")}</h2>
      <p class="muted">${T("أدخل كلمة المرور الجديدة لحسابك ثم سجّل دخولك بها.","Enter a new password, then sign in with it.")}</p>
      <label>${T("كلمة المرور الجديدة","New password")}</label><input id="np1" type="password" autocomplete="new-password">
      <label>${T("تأكيد كلمة المرور","Confirm password")}</label><input id="np2" type="password" autocomplete="new-password">
      <div style="height:14px"></div>
      <button class="btn" style="width:100%" onclick="doResetPassword()">${T("حفظ كلمة المرور","Save password")}</button>
    </div></div>`;
}
async function doResetPassword(){
  const p1=$("#np1").value, p2=$("#np2").value;
  if(!p1||p1.length<6) return toast(L("كلمة المرور يجب ألا تقل عن 6 أحرف","Password must be at least 6 characters"));
  if(p1!==p2) return toast(L("كلمتا المرور غير متطابقتين","Passwords do not match"));
  const {error} = await sb.auth.updateUser({password:p1});
  if(error) return toast(L("تعذر الحفظ","Save failed")+": "+error.message);
  toast(L("تم تعيين كلمة المرور بنجاح","Password updated"));
  location.hash="";
  setTimeout(()=>location.reload(), 1200);
}

function shell(title, html, bar=""){
  const roleAr = {supervisor:T("مشرف فرع","Supervisor"),technician:T("فني ميداني","Technician"),client:T("حساب عميل","Client")}[me.role];
  app.innerHTML = `

    <img src="${LOGO}" alt="">

    <div class="who">${esc(me.full_name)}<br>${roleAr}${me.branch?" — "+esc(me.branch):""}</div>
  </div>

const back = h => `<button class="btn quiet sm" onclick="location.hash='${h}'">${T("رجوع","Back")}</button>`;

async function route(){
  if(scanner){ try{await scanner.stop()}catch(e){} scanner=null; }
  const h = location.hash.replace(/^#\/?/,"");
  const [page,id] = h.split("/");
  try{
    if(page==="client")      return clientPage(id);
    if(page==="visit")       return visitPage(id);
    if(page==="review")      return reviewPage(id);
    if(page==="report")      return reportPage(id);
    if(page==="labels")      return labelsPage(id);
    if(page==="scan")        return scanPage(id);
    return homePage();
  }catch(e){ console.error(e); toast(L("حدث خطأ في التحميل","Loading error")); }
}

/* ---------------------- الوصول عبر مسح ملصق QR ---------------------- */
async function scanPage(code){
  code = decodeURIComponent(code||"");
  const {data:a} = await sb.from("assets").select("*").eq("qr_code",code).maybeSingle();
  if(!a){ toast(L("هذا الرمز غير معروف أو لا يخص فرعك","Unknown code or not in your branch")); return location.hash="#/"; }
  if(me.role==="client") return publicRequestPage(code);

  // فني/مشرف: افتح زيارة اليوم المفتوحة لهذا العميل أو ابدأ واحدة، ثم افتح بطاقة الجهاز مباشرة
  const today = new Date().toISOString().slice(0,10);
  let {data:v} = await sb.from("visits").select("*").eq("client_id",a.client_id).eq("technician_id",me.id)
    .in("status",["draft","rejected"]).eq("visit_date",today)
    .order("created_at",{ascending:false}).limit(1).maybeSingle();
  if(!v){
    const {data:nv,error} = await sb.from("visits").insert({client_id:a.client_id,technician_id:me.id}).select().single();
    if(error){ toast(L("تعذر بدء الزيارة","Could not start visit")+": "+error.message); return location.hash="#/"; }
    v = nv;
  }
  sessionStorage.setItem("openAssetAfterLoad", a.id);
  sessionStorage.setItem("openAssetScanned", "1");   // فُتح بمسح الملصق فعلاً (إثبات حضور)
  location.hash = "#/visit/"+v.id;
}

    app.innerHTML = `<div class="center">${head}<div class="card" style="text-align:center">
      <h3>${T("لم يُعثر على هذا الجهاز","Equipment not found")}</h3>
      <p class="muted">${T("للمساعدة اتصل بنا","For help, call us")}</p>
      <a href="tel:${SUPPORT_PHONE}" style="font-size:22px;font-weight:700;direction:ltr;display:block">☎ ${SUPPORT_PHONE}</a></div></div>`;
    return;
  }
  window._reqCode = code; window._reqPhoto = null;
  app.innerHTML = `<div class="center" style="max-width:520px">${head}
    <div class="card">
      <h2>${T("طلب صيانة","Maintenance request")}</h2>
      <div style="margin-top:10px;padding:10px 12px;background:var(--brand-soft);border-radius:10px">
        <b>${esc(a.name_ar)}</b>${a.name_en&&a.name_en!==a.name_ar?`<span class="en">${esc(a.name_en)}</span>`:""}
        <div class="muted" style="direction:ltr;text-align:end">${esc(a.asset_no)}${a.location_text?" · "+esc(a.location_text):""}</div>
        <div class="muted">${esc(a.client_name_ar||"")}</div>
      </div>
      <label>${T("وصف المشكلة *","Describe the problem *")}</label>
      <textarea id="rqDesc" maxlength="1500" placeholder="${L("مثال: الثلاجة لا تبرد منذ الصباح","e.g. not cooling since this morning")}"></textarea>
      <label>${T("صورة (اختياري)","Photo (optional)")}</label>
      <div class="photos" id="rqPhotoBox"><button class="addphoto" onclick="pickRequestPhoto()">${T("+ صورة","+ Photo")}</button></div>
      <div class="grid2">
        <div><label>${T("الاسم","Name")}</label><input id="rqName" maxlength="120" value="${esc(me?.full_name||"")}"></div>
        <div><label>${T("رقم الجوال","Mobile")}</label><input id="rqPhone" type="tel" maxlength="30" style="direction:ltr" value="${esc(me?.phone||"")}"></div>
      </div>
      <div style="height:16px"></div>
      <button class="btn" id="rqSend" style="width:100%" onclick="sendRequest()">${T("إرسال الطلب","Send request")}</button>
      <p class="muted" style="text-align:center;margin:14px 0 0">${T("أو اتصل بنا مباشرة","Or call us directly")}
        <a href="tel:${SUPPORT_PHONE}" style="display:block;font-size:20px;font-weight:700;direction:ltr">☎ ${SUPPORT_PHONE}</a></p>
    </div>
    ${me?`<p style="text-align:center"><a href="#/">${L("الرئيسية","Home")}</a></p>`
       :`<p style="text-align:center"><a href="#" onclick="loginScreen();return false">${L("دخول الموظفين","Staff sign in")}</a></p>`}
  </div>`;
}
function pickRequestPhoto(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    toast(L("جارٍ رفع الصورة…","Uploading photo…"));
    try{
      const blob = await compress(f);
      const path = `requests/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const {error} = await sb.storage.from("visit-photos").upload(path,blob,{contentType:"image/jpeg"});
      if(error) throw error;
      window._reqPhoto = sb.storage.from("visit-photos").getPublicUrl(path).data.publicUrl;
      $("#rqPhotoBox").innerHTML = `<img src="${window._reqPhoto}"><button class="addphoto" onclick="pickRequestPhoto()">${T("تغيير","Change")}</button>`;
    }catch(e){ toast(L("تعذر رفع الصورة","Photo upload failed")+": "+(e.message||"")); }
  };
  inp.click();
}
async function sendRequest(){
  const desc = $("#rqDesc").value.trim();
  if(desc.length<3) return toast(L("اكتب وصف المشكلة","Please describe the problem"));
  const btn = $("#rqSend"); btn.disabled = true;
  const {error} = await sb.rpc("submit_service_request",{p_code:window._reqCode, p_name:$("#rqName").value,
    p_phone:$("#rqPhone").value, p_description:desc, p_photo_url:window._reqPhoto});
  if(error){
    btn.disabled = false;
    return toast(/too_many/.test(error.message)
      ? L("وصلتنا طلبات كثيرة لهذا الجهاز مؤخراً — اتصل بنا مباشرة","Too many recent requests for this equipment — please call us")
      : L("تعذر إرسال الطلب","Could not send request")+": "+error.message, 4500);
  }
  app.querySelector(".card").innerHTML = `<div style="text-align:center;padding:10px 0">
    <div style="font-size:46px;color:var(--ok)">✓</div>
    <h2>${T("تم استلام طلبك","Request received")}</h2>
    <p class="muted">${T("سيتواصل معك فريق الصيانة قريباً.","Our maintenance team will contact you soon.")}</p>
    <a href="tel:${SUPPORT_PHONE}" style="font-size:20px;font-weight:700;direction:ltr;display:block">☎ ${SUPPORT_PHONE}</a></div>`;
}

async function homePage(){

/* ---------------------- استيراد Excel ---------------------- */
function importExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls,.csv";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    const wb = XLSX.read(await f.arrayBuffer());
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    if(!rows.length) return toast(L("الملف فارغ","File is empty"));
    const cols = Object.keys(rows[0]);
    const pick = (...keys)=>cols.find(c=>keys.some(k=>c.includes(k)))||"";
    const map = {name:pick("اسم الجهاز","الجهاز","Equipment","Name"), no:pick("رقم الأصل","الأصل","Asset","Tag","م"),
      brand:pick("الماركة","Brand","Make"), model:pick("الموديل","Model"),
      serial:pick("التسلسلي","السيريال","Serial"), loc:pick("الموقع","Location"), cat:pick("التصنيف","النوع","Category")};
    const sel = k => `<select id="m_${k}">${["",...cols].map(c=>`<option ${c===map[k]?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
    openSheet(`<h3>${T(`استيراد ${rows.length} صفاً`,`Import ${rows.length} rows`)}</h3>
      <p class="muted">${T("طابق أعمدة ملفك بحقول النظام. اسم الجهاز ورقم الأصل مطلوبان.","Match your file's columns. Equipment name and asset no. are required.")}</p>
      <label>${T("اسم الجهاز","Equipment name")}</label>${sel("name")}<label>${T("رقم الأصل","Asset No.")}</label>${sel("no")}
      <div class="grid2"><div><label>${T("الماركة","Brand")}</label>${sel("brand")}</div><div><label>${T("الموديل","Model")}</label>${sel("model")}</div></div>
      <div class="grid2"><div><label>${T("الرقم التسلسلي","Serial No.")}</label>${sel("serial")}</div><div><label>${T("الموقع","Location")}</label>${sel("loc")}</div></div>
      <label>${T("التصنيف","Category")}</label>${sel("cat")}
      <div style="height:16px"></div>
      <div class="row"><button class="btn" onclick="runImport()">${T("استيراد","Import")}</button>
      <button class="btn quiet" onclick="closeSheet()">${T("إلغاء","Cancel")}</button></div>`);
    window._rows = rows;
  };
  inp.click();
}
async function runImport(){
  const g = k => $("#m_"+k).value;
  const [name,no] = [g("name"),g("no")];
  if(!name||!no) return toast(L("حدد عمودَي اسم الجهاز ورقم الأصل","Select the name and asset no. columns"));
  const cid = window._client.id;
  const recs = window._rows.map(r=>({
    client_id:cid, name_ar:String(r[name]||"").trim(), asset_no:String(r[no]||"").trim(),
    brand:g("brand")?String(r[g("brand")]||""):null, model:g("model")?String(r[g("model")]||""):null,
    serial_no:g("serial")?String(r[g("serial")]||""):null, location_text:g("loc")?String(r[g("loc")]||""):null,
    category:(()=>{const v=g("cat")?String(r[g("cat")]||""):""; return CATS.find(c=>v.includes(c)||v.toLowerCase().includes(CAT_EN[c].toLowerCase()))||"أخرى";})()
  })).filter(r=>r.name_ar && r.asset_no);
  if(!recs.length) return toast(L("لا توجد صفوف صالحة","No valid rows"));
  closeSheet(); toast(L("جارٍ الاستيراد…","Importing…"));
  const {error} = await sb.from("assets").insert(recs);
  if(error) return toast(L("تعذر الاستيراد","Import failed")+": "+error.message);
  toast(L(`أُضيف ${recs.length} جهازاً`,`${recs.length} items added`)); route();
}

/* ---------------------- الزيارة ---------------------- */
async function startVisit(clientId){
  const {data,error} = await sb.from("visits").insert({client_id:clientId,technician_id:me.id}).select().single();
  if(error) return toast(L("تعذر بدء الزيارة","Could not start visit")+": "+error.message);
  location.hash = "#/visit/"+data.id;
}

async function loadVisit(id){
  const {data:v} = await sb.from("visits").select("*,clients(*)").eq("id",id).single();
  const {data:assets=[]} = await sb.from("assets").select("*").eq("client_id",v.client_id).eq("active",true).order("asset_no");
  const {data:items=[]} = await sb.from("visit_items").select("*,photos(*)").eq("visit_id",id);
  const order = new Map((assets||[]).map((a,i)=>[a.id,i]));
  (items||[]).sort((x,y)=>(order.get(x.asset_id)??1e9)-(order.get(y.asset_id)??1e9));
  return {v,assets,items};
}

async function visitPage(id){
  const {v,assets:allAssets,items} = await loadVisit(id);
  const isEmergency = v.visit_type==="emergency";
  const assets = isEmergency ? allAssets.filter(a=>a.id===v.target_asset_id) : allAssets;
  window._v = v; window._assets = assets; window._items = items;
  const done = new Map(items.map(i=>[i.asset_id,i]));
  const pct = assets.length ? Math.round(done.size/assets.length*100) : 0;
  const readOnly = !(v.status==="draft"||v.status==="rejected") || me.role==="client";

  let body = `<div class="spread" style="margin-bottom:12px">${back("#/client/"+v.client_id)}
    <span class="pill">${isEmergency?"⚡ "+L("طارئة","Emergency"):"\u2066"+done.size+" / "+assets.length+"\u2069"}</span></div>`;

  if(isEmergency) body += `<div class="card" style="border-color:var(--parts)">
    <h3 style="color:var(--parts)">⚡ ${T("طلب صيانة طارئة","Emergency maintenance request")}</h3>
    ${v.general_notes?`<p>${esc(v.general_notes)}</p>`:`<p class="muted">${T("لا يوجد وصف إضافي — افتح الجهاز أدناه وسجّل حالته.","No description — open the equipment below and record its condition.")}</p>`}</div>`;

  if(v.status==="rejected") body += `<div class="card" style="border-color:var(--down)">
    <h3 style="color:var(--down)">${T("أُعيدت الزيارة للتعديل","Visit returned for edits")}</h3><p>${esc(v.reject_reason||"")}</p></div>`;

  const canEditCrm = me.role==="supervisor"; // الفني لا يتعامل مع تذكرة CRM ولا عرض السعر — هذا للمشرف فقط
  body += `<div class="card"><h3>${esc(v.clients.name_ar)}</h3>
    <p class="muted">${L("زيارة","Visit")} ${fmt(v.visit_date)} · ${L("بدأت","Started")} ${time(v.check_in)}</p>
    <div class="mosaic">${assets.map(a=>{const it=done.get(a.id);
      return `<i style="background:${it?`var(${stateOf(it.condition).v})`:"#CBD5E1"}"></i>`}).join("")}</div>
    <div class="rail"><span style="width:${pct}%"></span></div>
    ${me.role!=="client"?`<div class="row" style="margin-top:10px;flex-wrap:wrap">
      <span class="pill">${L("تذكرة CRM","CRM ticket")}: ${esc(v.crm_ticket_no||"—")}</span>
      ${v.quote_url?`<a class="pill" href="${v.quote_url}" target="_blank" rel="noopener">${L("عرض السعر","Quote")} ↗</a>`:""}
      ${canEditCrm?`<button class="btn quiet sm" onclick="editCrmInfo()">${T("تعديل بيانات CRM","Edit CRM info")}</button>`:""}
    </div>`:""}</div>`;

  if(!readOnly) body += `<div class="card"><div class="spread"><h3>${T("مسح ملصق الجهاز","Scan equipment QR")}</h3>
    <button class="btn ghost sm" onclick="toggleScan()">${T("فتح الكاميرا","Open camera")}</button></div>
    <div id="reader" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap">
      <input id="manualCode" placeholder="${L("أو اكتب رقم الأصل / الكود","Or type asset no. / code")}" style="direction:ltr"
        onkeydown="if(event.key==='Enter')manualOpen()">
      <button class="btn quiet sm" onclick="manualOpen()">${T("فتح","Open")}</button></div></div>`;

  body += `<div class="card"><h3>${T("الأجهزة","Equipment")}</h3>
    ${assets.length>6?searchBox("vlist",true):""}
    <div class="list" id="vlist" style="margin-top:10px">
    ${assets.map(a=>{ const it=done.get(a.id); const s=it?stateOf(it.condition):null;
      return `<button class="item" data-q="${esc(searchKey(a))}" data-done="${it?1:0}" onclick="openAsset('${a.id}')">
        <span class="edge" style="background:${s?`var(${s.v})`:"#CBD5E1"}"></span>
        ${a.base_photo_url?`<img class="thumb" src="${a.base_photo_url}">`:""}
        <span class="body"><span class="t">${assetName(a)}</span>
        <span class="s">${esc(a.asset_no)} ${a.location_text?"· "+esc(a.location_text):""}</span></span>
        <span style="font-size:12.5px;color:var(--muted);text-align:end">${it?T(esc(it.condition),condEn(it.condition)):T("لم يُفحص","Not checked")}
          ${it?.scanned?`<span style="display:block;color:var(--ok);font-weight:700;direction:ltr">✓ QR</span>`:""}</span></button>`;
    }).join("")}</div></div>`;

  const bar = readOnly ? "" :
    (isEmergency ? `<button class="btn" onclick="finishVisit()">${T("إنهاء الطلب","Finish request")}</button>`
      : `<button class="btn quiet" onclick="addAssetInVisit()">${T("جهاز غير مسجّل","Unlisted equipment")}</button>
     <button class="btn" onclick="finishVisit()">${T("إنهاء الزيارة","Finish visit")}</button>`);
  shell(isEmergency?T("صيانة طارئة","Emergency maintenance"):T("زيارة صيانة وقائية","Preventive maintenance visit"), body, bar);
  window._client = v.clients;

  const pendingAsset = sessionStorage.getItem("openAssetAfterLoad");
  const viaScan = sessionStorage.getItem("openAssetScanned")==="1";
  sessionStorage.removeItem("openAssetScanned");
  if(pendingAsset){
    sessionStorage.removeItem("openAssetAfterLoad");
    if(assets.some(x=>x.id===pendingAsset)) openAsset(pendingAsset, viaScan);
  }
}

async function toggleScan(){
  if(scanner){ await scanner.stop(); scanner=null; return; }
  scanner = new Html5Qrcode("reader");
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}}, txt=>{
      const code = codeFrom(txt);
      const a = window._assets.find(x=>x.qr_code===code);
      scanner.stop().then(()=>{scanner=null;});
      if(a) openAsset(a.id, true); else toast(L("هذا الملصق لا يخص أجهزة هذا العميل","This label is not for this client's equipment"));
    }, ()=>{});
  }catch(e){ scanner=null; toast(L("تعذر فتح الكاميرا. اختر الجهاز من القائمة.","Camera unavailable. Pick the equipment from the list.")); }
}

// إدخال يدوي إذا تعذّر مسح الملصق: يقبل كود الملصق أو رقم الأصل (MAA-001)
function manualOpen(){
  const v = codeFrom($("#manualCode").value).toLowerCase(); if(!v) return;
  const a = window._assets.find(x=>(x.qr_code||"").toLowerCase()===v || (x.asset_no||"").toLowerCase()===v);
  if(a) openAsset(a.id); else toast(L("لا يوجد جهاز بهذا الرقم ضمن هذه الزيارة","No equipment with this number in this visit"));
}

      <button class="btn quiet sm" onclick="pickQuoteFile()">${v.quote_url?T("استبدال الملف","Replace file"):T("إرفاق ملف","Attach file")}</button>

    </div>
    <div style="height:16px"></div>

function pickQuoteFile(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*,application/pdf";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    toast(L("جارٍ رفع الملف…","Uploading file…"));
    try{
      const ext = (f.name.split(".").pop()||"pdf").toLowerCase();
      const path = `quotes/${window._v.id}-${Date.now()}.${ext}`;
      const {error} = await sb.storage.from("visit-photos").upload(path,f,{contentType:f.type||"application/octet-stream"});
      if(error) throw error;
      const {data} = sb.storage.from("visit-photos").getPublicUrl(path);
      window._crmDraft.quote_url = data.publicUrl;
      const row = $("#crmQuoteRow");
      if(row) row.innerHTML = `<a href="${data.publicUrl}" target="_blank" rel="noopener" class="pill">${L("الملف الجديد","New file")} ↗</a>
        <button class="btn quiet sm" onclick="pickQuoteFile()">${T("استبدال الملف","Replace file")}</button>`;
      toast(L("تم رفع الملف — اضغط حفظ لإتمام الحفظ","File uploaded — press Save to finish"));
    }catch(e){ toast(L("تعذر رفع الملف","File upload failed")+": "+(e.message||"")); }
  };
  inp.click();
}
async function saveCrmInfo(){
  const crm_ticket_no = $("#crmNo").value.trim()||null;
  const {quote_url} = window._crmDraft;
  const {error} = await sb.from("visits").update({crm_ticket_no,quote_url}).eq("id",window._v.id);
  if(error) return toast(L("تعذر الحفظ","Save failed")+": "+error.message);
  closeSheet(); toast(L("تم حفظ بيانات CRM","CRM info saved")); route();
}

/* ---------------------- بطاقة فحص الجهاز ---------------------- */
function openSheet(html){
  const d=document.createElement("div"); d.className="sheet noprint"; d.id="sheetEl";
  d.innerHTML = `<div class="panel">${html}</div>`;
  d.addEventListener("click",e=>{ if(e.target===d) closeSheet(); });
  document.body.appendChild(d);
}
function closeSheet(){ $("#sheetEl")?.remove(); }

// scanned=true فقط عند فتح الجهاز بمسح ملصقه (كاميرا التطبيق أو كاميرا الجوال) — وليس من القائمة أو الإدخال اليدوي
async function openAsset(assetId, scanned=false){
  const a = window._assets.find(x=>x.id===assetId);
  const item = window._items.find(i=>i.asset_id===assetId);
  const readOnly = !(window._v.status==="draft"||window._v.status==="rejected");

  // سجل الجهاز السابق
  const {data:hist=[]} = await sb.from("visit_items")
    .select("condition,technician_notes,parts_needed_text,photos(url,type),visits!inner(visit_date,status,id)")
    .eq("asset_id",assetId).neq("visit_id",window._v.id)
    .order("created_at",{ascending:false}).limit(10);
  // طلبات العميل المفتوحة على هذا الجهاز — يراها الفني قبل الفحص
  const {data:openReqs=[]} = await sb.from("service_requests").select("description,created_at,photo_url")
    .eq("asset_id",assetId).neq("status","closed").order("created_at",{ascending:false}).limit(5);
  const repeated = item ? false : hist.some(h=>h.condition!=="سليم" && h.condition!=="غير متاح للفحص");

  window._draft = { assetId, condition:item?.condition||null, itemId:item?.id||null,
    scanned: !!(item?.scanned || scanned), scanned_at: item?.scanned_at || (scanned ? new Date().toISOString() : null),
    notes:item?.technician_notes||"", parts:item?.parts_needed_text||"",
    photos:(item?.photos||[]).map(p=>({url:p.url,type:p.type})) };

  openSheet(`
    <div class="spread"><h3>${assetName(a)} ${window._draft.scanned?`<span class="pill" style="background:#E3F4EF;color:var(--ok)">✓ QR</span>`:""}</h3><button class="btn quiet sm" onclick="closeSheet()">${T("إغلاق","Close")}</button></div>
    <div style="text-align:center;margin:6px 0 10px">
      ${a.base_photo_url?`<img src="${a.base_photo_url}" alt="${L("الصورة المرجعية","Reference photo")}" style="max-width:200px;max-height:200px;border-radius:10px;border:1px solid var(--line);object-fit:cover">`
        :`<p class="muted" style="margin:0 0 6px">${T("لا توجد صورة مرجعية لهذا الجهاز بعد — أضِفها للتأكد من هوية الجهاز عند كل زيارة.","No reference photo yet — add one to identify this equipment on every visit.")}</p>`}
      <div style="margin-top:6px">
        <button class="btn quiet sm" onclick="uploadAssetPhoto('${a.id}')">${a.base_photo_url?T("تغيير الصورة المرجعية","Change reference photo"):T("إضافة صورة مرجعية","Add reference photo")}</button>
        ${a.base_photo_url&&me.role==="supervisor"?`<button class="btn quiet sm" style="color:var(--down)" onclick="removeAssetPhoto('${a.id}')">🗑 ${T("حذف الصورة","Delete photo")}</button>`:""}
      </div>
    </div>
    <p class="muted">${esc(a.asset_no)} · ${L(esc(a.category),CAT_EN[a.category]||"")} ${a.brand?"· "+esc(a.brand):""} ${a.model?"· "+esc(a.model):""}
      ${a.serial_no?"<br>"+L("الرقم التسلسلي","Serial No.")+": "+esc(a.serial_no):""} ${a.location_text?"<br>"+L("الموقع","Location")+": "+esc(a.location_text):""}</p>
    ${(openReqs||[]).length?`<div class="card" style="background:#FDE8EC;border-color:var(--down);padding:11px">
      <b style="color:var(--down)">${L("بلاغ من العميل","Client report")}:</b>
      ${openReqs.map(r=>`<div style="margin-top:4px">${esc(r.description)} <span class="muted">${fmt(r.created_at)}</span>
        ${r.photo_url?`<div class="photos"><img src="${r.photo_url}"></div>`:""}</div>`).join("")}</div>`:""}
    ${repeated?`<div class="card" style="background:#FEF6E7;border-color:var(--maint);padding:11px">
      <b style="color:var(--maint)">${L("تنبيه","Warning")}:</b> ${T("سُجّلت ملاحظات على هذا الجهاز في زيارة سابقة.","Issues were recorded on this equipment in a previous visit.")}</div>`:""}

/* ---------------------- الصورة المرجعية للجهاز ---------------------- */
function uploadAssetPhoto(assetId){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    toast(L("جارٍ رفع الصورة…","Uploading photo…"));
    try{
      const blob = await compress(f);
      const path = `assets/${assetId}-${Date.now()}.jpg`;
      const {error:upErr} = await sb.storage.from("visit-photos").upload(path,blob,{contentType:"image/jpeg"});
      if(upErr) throw upErr;
      const {data:pub} = sb.storage.from("visit-photos").getPublicUrl(path);
      const {error} = await sb.rpc("set_asset_base_photo",{p_asset_id:assetId,p_photo_url:pub.publicUrl});
      if(error) throw error;
      toast(L("تم حفظ الصورة المرجعية","Reference photo saved"));
      (window._assets||[]).forEach(a=>{ if(a.id===assetId) a.base_photo_url = pub.publicUrl; });
      if(window._draft && window._draft.assetId===assetId){ closeSheet(); openAsset(assetId); }
      else route();
    }catch(e){ toast(L("تعذر رفع الصورة","Photo upload failed")+": "+(e.message||"")); }
  };
  inp.click();
}

async function removeAssetPhoto(assetId){
  if(!confirm(L("حذف الصورة المرجعية لهذا الجهاز؟","Delete this equipment's reference photo?"))) return;
  const {error} = await sb.from("assets").update({base_photo_url:null}).eq("id",assetId);
  if(error) return toast(L("تعذر الحذف","Delete failed")+": "+error.message);
  (window._assets||[]).forEach(a=>{ if(a.id===assetId) a.base_photo_url = null; });
  toast(L("حُذفت الصورة المرجعية","Reference photo deleted"));

function pickPhoto(type){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    keepText(); toast(L("جارٍ رفع الصورة…","Uploading photo…"));
    try{
      const blob = await compress(f);
      const path = `${window._v.id}/${window._draft.assetId}-${type}-${Date.now()}.jpg`;
      const {error} = await sb.storage.from("visit-photos").upload(path,blob,{contentType:"image/jpeg"});
      if(error) throw error;
      const {data} = sb.storage.from("visit-photos").getPublicUrl(path);
      window._draft.photos.push({url:data.publicUrl,type,isNew:true});
      renderExtra(); toast(L("تم رفع الصورة","Photo uploaded"));
    }catch(e){ toast(L("تعذر رفع الصورة","Photo upload failed")+": "+(e.message||"")); }
  };
  inp.click();
}
function dropPhoto(type,i){
  if(!confirm(L("حذف هذه الصورة؟","Delete this photo?"))) return;
  keepText();
  const list = window._draft.photos.filter(p=>p.type===type);
  const target = list[i];
  window._draft.photos = window._draft.photos.filter(p=>p!==target);
  renderExtra();
}
function keepText(){
  const d=window._draft;
  if($("#notes")) d.notes=$("#notes").value;
  if($("#parts")) d.parts=$("#parts").value;
}
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej(new Error(L("فشل الضغط","Compression failed"))),"image/jpeg",0.7);
    };
    img.onerror=()=>rej(new Error(L("ملف صورة غير صالح","Invalid image file")));
    img.src=url;
  });
}

let savingItem = false;
async function saveItem(){
  if(savingItem) return;   // منع الحفظ المزدوج عند الضغط مرتين
  keepText();
  const d = window._draft;
  if(!d.condition) return toast(L("اختر حالة الجهاز","Choose the equipment condition"));
  if(!d.photos.some(p=>p.type==="general")) return toast(L("أضف صورة الجهاز","Add an equipment photo"));
  if(d.condition!=="سليم"){
    if(!d.photos.some(p=>p.type==="defect")) return toast(L("أضف صورة للعيب","Add a defect photo"));
    if(!d.parts.trim()) return toast(L("اكتب القطع المطلوبة أو وصف العطل","Write the parts needed or the fault"));
  }
  const payload = {visit_id:window._v.id, asset_id:d.assetId, condition:d.condition,
    technician_notes:d.notes.trim()||null, parts_needed_text:d.condition==="سليم"?null:d.parts.trim(),
    scanned:d.scanned, scanned_at:d.scanned_at};
  savingItem = true;
  try{ await persistItem(d, payload); } finally { savingItem = false; }
}
async function persistItem(d, payload){
  let itemId = d.itemId;
  if(itemId){
    const {error} = await sb.from("visit_items").update(payload).eq("id",itemId);
    if(error) return toast(L("تعذر الحفظ","Save failed")+": "+error.message);
    await sb.from("photos").delete().eq("visit_item_id",itemId);
  }else{
    const {data,error} = await sb.from("visit_items").insert(payload).select().single();
    if(error) return toast(L("تعذر الحفظ","Save failed")+": "+error.message);
    itemId = data.id;
  }
  const rows = d.photos.map(p=>({visit_item_id:itemId,url:p.url,type:p.type}));
  if(rows.length) await sb.from("photos").insert(rows);
  closeSheet(); toast(L("حُفظ الجهاز","Equipment saved")); route();
}

/* ---------------------- تصحيح إملائي بالذكاء الاصطناعي ---------------------- */
async function aiFixReport(visitId){
  const btn = $("#aiFixBtn");
  const fields = [];
  const recTa = $("#rec");
  if(recTa && recTa.value.trim()) fields.push({id:"rec", text:recTa.value});
  for(const i of (window._items||[])){
    const noteTa = $("#note_"+i.id);
    if(noteTa && noteTa.value.trim()) fields.push({id:"note_"+i.id, text:noteTa.value});
    const partsTa = $("#parts_"+i.id);
    if(partsTa && partsTa.value.trim()) fields.push({id:"parts_"+i.id, text:partsTa.value});
  }
  if(!fields.length) return toast(L("لا يوجد نص لتصحيحه","No text to fix"));
  btn.disabled = true; const oldLabel = btn.innerHTML; btn.textContent = L("جارٍ التصحيح…","Fixing…");
  try{
    const {data,error} = await sb.functions.invoke("fix-arabic-text",{body:{items:fields}});
    if(error) throw error;
    const byId = new Map((data?.items||[]).map(x=>[x.id,x.corrected]));
    let changed = 0;
    for(const f of fields){
      const corrected = byId.get(f.id);
      if(corrected==null) continue;
      const el = $("#"+f.id);
      if(el && corrected !== el.value){ el.value = corrected; changed++; }
    }
    toast(changed ? L(`تم تصحيح ${changed} حقلاً — راجعها قبل الاعتماد`,`${changed} fields fixed — review before approving`) : L("لم يحتَج النص أي تصحيح","No corrections needed"));
  }catch(e){
    toast(L("تعذر التصحيح التلقائي","AI fix failed")+": "+(e.message||"fix-arabic-text"));
  }finally{
    btn.disabled = false; btn.innerHTML = oldLabel;
  }
}

async function approveVisit(id){
  const rec = $("#rec")?.value||"";

  for(const i of (window._items||[])){
    const patch = {};

    if(noteTa){ const val = noteTa.value.trim()||null; if(val !== (i.technician_notes||null)) patch.technician_notes = val; }
    const partsTa = $("#parts_"+i.id);
    if(partsTa){ const val = partsTa.value.trim()||null; if(val !== (i.parts_needed_text||null)) patch.parts_needed_text = val; }

        <div style="font-size:11.5px">فُحص بمسح الملصق</div><div class="bi" style="font-size:10px">Verified by QR scan on site</div></div>`:""}
    </div>
    ${v.visit_type==="emergency"&&v.general_notes?`<div style="margin:0 0 12px;font-size:12.5px"><b>وصف الطلب / Request</b>
      <div style="white-space:pre-line">${esc(v.general_notes)}</div></div>`:""}

    <table class="rtable"><thead><tr>
      <th>رقم الأصل<div class="bi">Asset No.</div></th>
      <th>الجهاز<div class="bi">Equipment</div></th>
      <th>الموقع<div class="bi">Location</div></th>
      <th>الماركة والموديل<div class="bi">Brand / Model</div></th>
      <th>الحالة<div class="bi">Condition</div></th>
      <th>القطع المطلوبة<div class="bi">Spare parts</div></th>
      <th>الصورة<div class="bi">Photo</div></th></tr></thead>
      <tbody>${items.map(i=>{const a=map.get(i.asset_id)||{}; const s=stateOf(i.condition);
        const ph=(i.photos||[])[0];
        return `<tr>
          <td>${esc(a.asset_no||"")}</td>
          <td>${esc(a.name_ar||"")}${a.name_en&&a.name_en!==a.name_ar?`<div class="bi">${esc(a.name_en)}</div>`:(a.name_en?"":`<div class="bi">${esc(CAT_EN[a.category]||"")}</div>`)}</td>
          <td>${esc(a.location_text||"—")}</td>
          <td>${esc(a.brand||"")} ${esc(a.model||"")}</td>
          <td><span class="dot ${s.c}"></span> ${esc(i.condition)}<div class="bi">${s.en}</div>${i.scanned?`<div style="font-size:10px;color:var(--ok);font-weight:700">✓ QR</div>`:""}</td>
          <td>${esc(i.parts_needed_text||"—")}${i.technician_notes?`<div class="bi">${esc(i.technician_notes)}</div>`:""}</td>
          <td>${ph?`<img src="${ph.url}">`:"—"}</td></tr>`;}).join("")}
      </tbody></table>

    ${v.recommendations?`<div style="margin-top:16px"><b>التوصيات العامة / Recommendations</b>
      <p style="font-size:12.5px">${esc(v.recommendations)}</p></div>`:""}

    <div class="sign">
      <div>ممثل شركة المحتسب<div class="bi">Al-Mohtaseb representative</div></div>
      <div>ممثل العميل<div class="bi">Client representative</div></div>
    </div>
  </div>`;
  window._reportItems = items.map(i=>({...i,asset:map.get(i.asset_id)}));
  window._reportVisit = v;
}

function exportVisitParts(){
  const rows = (window._reportItems||[]).filter(i=>i.condition!=="سليم").map(i=>({
    "رقم الأصل / Asset No.":i.asset?.asset_no||"", "الجهاز / Equipment":i.asset?.name_ar||"", "الموقع / Location":i.asset?.location_text||"",
    "الحالة / Condition":L(i.condition,condEn(i.condition)), "القطع المطلوبة / Spare parts":i.parts_needed_text||"", "ملاحظات / Notes":i.technician_notes||""
  }));
  if(!rows.length) return toast(L("جميع الأجهزة سليمة — لا قطع مطلوبة","All equipment good — no parts needed"));
  const ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"القطع");
  XLSX.writeFile(wb,`قطع_${window._reportVisit.report_no||"زيارة"}.xlsx`);
}
async function shareReport(){
  const url = location.href;
  const txt = `تقرير الصيانة / Maintenance Report — ${window._reportVisit.clients.name_ar}\n${url}`;
  if(navigator.share){ try{ await navigator.share({title:"تقرير الصيانة / Maintenance Report",text:txt,url}); return; }catch(e){} }
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}
</script>
</body>
</html>
